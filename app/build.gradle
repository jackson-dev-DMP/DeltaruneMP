plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deltarunemp.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.deltarunemp.launcher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
