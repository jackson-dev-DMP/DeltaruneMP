name: Gemini Issue Helper

on:
  issues:
    types: [opened]

jobs:
  reply:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ask Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TITLE="${{ github.event.issue.title }}"
          BODY="${{ github.event.issue.body }}"
          USER="${{ github.event.issue.user.login }}"
          
          PROMPT="You are a helpful assistant for my repository. The issue author is '$USER'. The repo owner's username is jackson-dev-DMP. If '$USER' matches jackson-dev-DMP, you are talking to the owner! Answer this GitHub issue titled '$TITLE'. Body: $BODY"
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "$PROMPT" '{"contents": [{"parts": [{"text": $msg}]}]}')")

          node -e '
            const res = '$RESPONSE';
            const text = res?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I could not generate a response right now.";
            require("fs").writeFileSync("reply.txt", text);
          '

      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const replyText = fs.readFileSync('reply.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: replyText
            });
            
