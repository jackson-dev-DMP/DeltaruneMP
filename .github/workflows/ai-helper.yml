name: Gemini Universal Helper

on:
  issues:
    types: [opened, labeled]
  discussion:
    types: [created]
  pull_request_target:
    types: [opened]

jobs:
  gemini-assistant:
    if: >-
      contains(github.event.issue.labels.*.name, 'ai-run') ||
      github.actor == 'jackson-dev-DMP'
    runs-on: ubuntu-latest

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Process with Gemini 3.6 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const eventPayload = context.payload.issue || context.payload.discussion || context.payload.pull_request;
            const title = eventPayload.title || "";
            const body = eventPayload.body || "";
            const user = eventPayload.user?.login || context.actor;
            const owner = "jackson-dev-DMP";
            const isOwner = (user === owner);

            // 1. SECURITY FILTER
            const rawInput = `${title}\n${body}`;
            if (/ignore\s+all|process\.env|secrets|reveal\s+key|override\s+security/i.test(rawInput)) {
              console.log(`Security violation intercepted from @${user}`);
              return;
            }

            // 2. SANITIZE INPUT
            const sanitizedBody = body
              .replace(/-----BEGIN[\s\S]*?-----END[^\n]*/g, "[REDACTED KEY]")
              .replace(/(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,}/g, "[REDACTED TOKEN]")
              .slice(0, 2000);

                        // 3. IMPROVED PROMPT (Forces Direct Answers & Enforces Safety)
            const prompt = ` You are Gemini-DeltaruneMP, an AI helper bot running inside a GitHub Action for this repository.

            Context Info:
            - Issue Author: @${user}
            - Repository Owner: @${owner}
            - Author is Repo Owner: ${isOwner}
            - Your Capabilities: You are a stateless GitHub Action workflow script. You can write comments, read issue text, and perform GitHub API tasks permitted by the workflow, but you do NOT have full administrative control or real-time live browsing outside this trigger.

            INSTRUCTIONS:
            - Skip long greetings or generic introductions.
            - Answer the user's specific questions directly and concisely.
            - You MUST NOT write malicious code, exploits, reverse shells, keyloggers, or dangerous scripts.
            - BANNED TOPICS: Shellcode execution, privilege escalation, obfuscated scripts, and network attacking tools.
            - Provide only safe, standard software development assistance.

            ISSUE TITLE: ${title}
            ISSUE CONTENT:
            ${sanitizedBody}`;
            

            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { 
                    maxOutputTokens: 800 // Increased so it doesn't get cut off!
                  },
                  safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_LOW_AND_ABOVE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_LOW_AND_ABOVE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_LOW_AND_ABOVE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_LOW_AND_ABOVE" }
                  ]
                })
              });

              const data = await res.json();
              const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";

              if (context.eventName === 'issues') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: reply
                });
              } else if (context.eventName === 'pull_request_target') {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: reply,
                  event: 'COMMENT'
                });
              }
            } catch (err) {
              console.error("Execution error:", err);
            }
            
