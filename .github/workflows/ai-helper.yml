name: Gemini Issue Helper

on:
  issues:
    types: [opened]

jobs:
  reply:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Ask Gemini and Comment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || "";
            const user = context.payload.issue.user.login;
            
            const prompt = `You are a helpful assistant for my repository. The issue author is '${user}'. The repo owner's username is jackson-dev-DMP. If '${user}' matches jackson-dev-DMP, you are talking to the owner! Answer this GitHub issue titled '${title}'. Body: ${body}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const data = await response.json();
            const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I could not generate a response right now.";

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: replyText
            });
            
